<div class="log-filters" role="tablist" aria-label="Ereignis-Filter">
  <button
    type="button"
    class="log-filter"
    [class.active]="filter() === 'all'"
    (click)="setFilter('all')"
  >
    Alle
  </button>
  <button
    type="button"
    class="log-filter"
    [class.active]="filter() === 'combat'"
    (click)="setFilter('combat')"
  >
    ⚔ Kampf
  </button>
  <button
    type="button"
    class="log-filter"
    [class.active]="filter() === 'progress'"
    (click)="setFilter('progress')"
  >
    ◆ Verlauf
  </button>
</div>

<div class="entries" #entriesEl role="log" aria-live="polite" aria-atomic="false">
  @for (entry of filteredLogs(); track entry.id) {
    <article class="entry-card" [class]="entry.type" [class.latest]="entry.id === latestLogId()">
      <span class="entry-rail" aria-hidden="true"></span>
      <header>
        <span class="entry-icon">{{ logIcon(entry.type) }}</span>
        <strong>{{ logLabel(entry.type) }}</strong>
        <time>{{ formatTime(entry.createdAt) }}</time>
      </header>
      <p>{{ entry.message }}</p>
    </article>
  } @empty {
    <p class="entries-empty">Noch keine Ereignisse — beginne deinen Zug.</p>
  }
</div>
